name: Deploy Prod

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: write

jobs:
  confirm:
    name: Require manual confirmation
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - run: echo "Deployment to production confirmed"

  deploy:
    name: Build & Deploy (prod)
    runs-on: ubuntu-latest
    environment: prod
    needs: confirm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Install dependencies
        run: npm install

      - name: Build Lambdas
        run: npm run build

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.7"

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" -backend-config="key=small-advertisement-writer-ai/prod/terraform.tfstate"

      - name: Terraform apply
        working-directory: terraform
        # Terraform zips dist/{fn}/ and deploys Lambda code via archive_file
        run: terraform apply -var-file=environments/prod.tfvars -auto-approve -input=false

      - name: Record deployment version
        run: |
          aws dynamodb put-item \
            --table-name saw-versions-prod \
            --item "{
              \"version\":    {\"S\": \"$GITHUB_SHA\"},
              \"deployedAt\": {\"S\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"},
              \"commitSha\":  {\"S\": \"$GITHUB_SHA\"},
              \"env\":        {\"S\": \"prod\"}
            }"

      - name: Tag release
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          TAG="prod-$(date +%Y%m%d-%H%M%S)"
          git tag $TAG
          git push origin $TAG
