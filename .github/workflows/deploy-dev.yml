name: Deploy Dev

on:
  push:
    branches: [develop]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build & Deploy (dev)
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Install dependencies
        run: npm ci

      - name: Build Lambdas
        run: npm run build

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ">=1.7"

      - name: Terraform init
        working-directory: terraform
        run: terraform init -backend-config="bucket=${{ secrets.TF_BACKEND_BUCKET }}" -backend-config="key=small-advertisement-writer-ai/dev/terraform.tfstate"

      - name: Terraform apply
        working-directory: terraform
        run: terraform apply -var-file=environments/dev.tfvars -auto-approve -input=false
